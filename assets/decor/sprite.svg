  <path d="M60 46 C 72 10, 116 6, 118 34 C 120 58, 86 62, 60 46 Z" fill="none" stroke="currentColor" stroke-width="3"/>
  <path d="M60 46 C 52 60, 30 66, 28 78" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M60 46 C 68 60, 90 66, 92 78" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
  <use href="#blossom" x="46" y="34" width="28" height="28"/>
