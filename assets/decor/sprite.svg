    <path d="M50 14 C 40 -4, 8 0, 6 22 C 4 40, 26 42, 48 30 Z" fill="currentColor" opacity=".9"/>
    <path d="M50 14 C 60 -4, 92 0, 94 22 C 96 40, 74 42, 52 30 Z" fill="currentColor" opacity=".9"/>
    <path d="M50 32 C 42 40, 20 46, 18 58 C 16 70, 34 72, 48 56 Z" fill="currentColor" opacity=".65"/>
    <path d="M50 32 C 58 40, 80 46, 82 58 C 84 70, 66 72, 52 56 Z" fill="currentColor" opacity=".65"/>
    <path d="M50 12 L50 60" stroke="#5B7A5E" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M50 14 C 46 8, 40 6, 36 8" fill="none" stroke="#5B7A5E" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M50 14 C 54 8, 60 6, 64 8" fill="none" stroke="#5B7A5E" stroke-width="1.6" stroke-linecap="round"/>
  </g>
