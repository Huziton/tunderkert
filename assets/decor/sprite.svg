    <circle cx="31" cy="20" r="7"/>
    <circle cx="20" cy="31" r="7"/>
    <circle cx="9" cy="20" r="7"/>
  </g>
  <circle cx="20" cy="20" r="5" fill="#F2C265"/>
</symbol>

<symbol id="butterfly" viewBox="0 0 100 80">
