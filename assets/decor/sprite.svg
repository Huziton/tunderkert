  <use href="#leaf-1" x="8" y="42" width="34" height="20" class="decor-leaf-accent"/>
  <use href="#leaf-1" x="58" y="8" width="30" height="18"/>
  <use href="#leaf-1" x="118" y="30" width="30" height="18" class="decor-leaf-accent"/>
  <use href="#leaf-1" x="168" y="2" width="26" height="16"/>
</symbol>

<symbol id="daisy" viewBox="0 0 60 60">
