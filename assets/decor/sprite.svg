</symbol>

<symbol id="swirl" viewBox="0 0 160 60">
  <path d="M4 30 C 30 4, 46 4, 58 20 C 68 34, 84 34, 90 20 C 96 8, 112 6, 122 18 C 130 28, 144 26, 156 12"
