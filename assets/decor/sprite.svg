<svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
<defs>

<symbol id="leaf-1" viewBox="0 0 100 60">
  <path d="M4 30 C 20 4, 60 2, 96 16 C 74 20, 56 30, 46 52 C 30 40, 14 36, 4 30 Z" fill="currentColor"/>
  <path d="M8 29 C 34 24, 62 24, 92 17" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1.6" stroke-linecap="round"/>
</symbol>

<symbol id="leaf-2" viewBox="0 0 60 100">
  <path d="M30 4 C 54 22, 58 60, 44 96 C 38 76, 26 62, 6 50 C 14 30, 20 14, 30 4 Z" fill="currentColor"/>
  <path d="M29 10 C 33 36, 33 62, 42 90" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="1.6" stroke-linecap="round"/>
</symbol>

<symbol id="branch" viewBox="0 0 220 90">
