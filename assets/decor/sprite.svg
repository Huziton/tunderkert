    <ellipse cx="30" cy="46" rx="7" ry="12"/>
    <ellipse cx="14" cy="30" rx="12" ry="7"/>
    <ellipse cx="46" cy="30" rx="12" ry="7"/>
    <ellipse cx="18.5" cy="18.5" rx="7" ry="11" transform="rotate(-45 18.5 18.5)"/>
    <ellipse cx="41.5" cy="18.5" rx="7" ry="11" transform="rotate(45 41.5 18.5)"/>
    <ellipse cx="18.5" cy="41.5" rx="7" ry="11" transform="rotate(45 18.5 41.5)"/>
    <ellipse cx="41.5" cy="41.5" rx="7" ry="11" transform="rotate(-45 41.5 41.5)"/>
  </g>
  <circle cx="30" cy="30" r="8" fill="#F2C265"/>
</symbol>

<symbol id="blossom" viewBox="0 0 40 40">
